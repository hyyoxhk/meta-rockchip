#@TYPE: Machine
#@NAME: RK3566 EVB

include conf/machine/include/machine-extlinux-config.inc
require conf/machine/include/rk356x.inc


MACHINE_FEATURES += "wifi pcmcia alsa bluetooth usbhost"

KERNEL_DEVICETREE = "rockchip/rk3566-tspi.dtb"

UBOOT_MACHINE = "lckfb-tspi-rk3566_defconfig"

RK_WIFIBT_RRECOMMENDS = " \
	kernel-module-bcmdhd \
	rkwifibt-firmware-ap6212a1-wifi \
	rkwifibt-firmware-ap6212a1-bt \
	brcm-tools \
"

MACHINE_EXTRA_RRECOMMENDS:append = " \
	drm-cursor \
	udev-conf-rockchip \
	gstreamer1.0-rockchip \
	rockchip-alsa-config \
	brcm-patchram-plus \
"

# IMAGE_BOOT_FILES ?= " \
#     ${KERNEL_IMAGETYPE} \
#     rk3566-tspi.dtb \
#     extlinux.conf;extlinux/extlinux.conf \
# "

IMAGE_BOOT_FILES ?= " \
    boot.scr \
    rk3566-tspi.dtb \
"

WKS_FILE_DEPENDS ?= " \
    u-boot \
"

SPL_BINARY ?= "idbloader.img"

RK_UBOOT_ENV = " "
# RK_UBOOT_ENV:rk-u-boot-env = "${@ '--source rawcopy --sourceparams=file=u-boot.env' \
# 	if bb.utils.to_boolean(d.getVar('RK_IMAGE_INCLUDES_UBOOT_ENV'), False) else ' '}"


WICVARS:append = " \
	RK_UBOOT_ENV \
	SPL_BINARY \
	UBOOT_SUFFIX \
	"

KERNEL_IMAGETYPE = "Image.lz4"
KERNEL_IMAGETYPES:append = " fitImage"
IMAGE_FSTYPES = " squashfs-zst"

HW_VERSION = "1.0"
IMAGE_VERSION = "6.0"
RK_ROOTFS_AB_PART_SIZE = "512M"
