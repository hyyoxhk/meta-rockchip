#@TYPE: Machine
#@NAME: YM-RK3588

include conf/machine/include/ym-sbc-rk3588-extlinux-config.inc
require conf/machine/include/rk3588.inc

MACHINE_FEATURES += "wifi pcmcia alsa bluetooth usbhost"

KERNEL_DEVICETREE = " \
    rockchip/ym-sbc-rk3588.dtb \
"

UBOOT_MACHINE = "rk3588_defconfig"
KBUILD_DEFCONFIG = "ym_sbc_rk3588_defconfig"

RK_WIFIBT_RRECOMMENDS = " \
    rkwifibt-firmware-ap6256-wifi \
    rkwifibt-firmware-ap6256-bt \
    brcm-tools \
"

MACHINE_EXTRA_RRECOMMENDS:append = " \
    drm-cursor \
    udev-conf-rockchip \
    gstreamer1.0-rockchip \
    rockchip-alsa-config \
    brcm-patchram-plus \
    rockchip-rkaiq-server \
    rockchip-rkaiq-iqfiles \
"

IMAGE_BOOT_FILES ?= " \
    ${KERNEL_IMAGETYPE} \
    ym-sbc-rk3588.dtb \
    extlinux.conf;extlinux/extlinux.conf \
"

WKS_FILE_DEPENDS ?= " \
    u-boot-rockchip \
    smart-image-userfs \
"

KERNEL_IMAGETYPES:append = " fitImage"
IMAGE_FSTYPES:append = " ext4 squashfs"

HW_VERSION = "1.0"
IMAGE_VERSION = "6.0"
FACTORY_IMAGE = "smart-image-standard"
