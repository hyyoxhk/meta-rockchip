#@TYPE: Machine
#@NAME: BT3576-EVM-V1.0

include conf/machine/include/bt3576-evm-extlinux-config.inc
require conf/machine/include/rk3576.inc

MACHINE_FEATURES += "wifi pcmcia alsa bluetooth usbhost"

KERNEL_DEVICETREE = " \
    rockchip/bt3576-evm-b.dtb \
"

UBOOT_MACHINE = "rk3576_defconfig"
RK_UBOOT_SPL = "1"
KBUILD_DEFCONFIG = "bt3576_evm_b_defconfig"

MACHINE_EXTRA_RRECOMMENDS:append = " \
    drm-cursor \
    udev-conf-rockchip \
    gstreamer1.0-rockchip \
    rockchip-alsa-config \
    brcm-patchram-plus \
"

IMAGE_BOOT_FILES ?= " \
    boot.img \
    extlinux.conf;extlinux/extlinux.conf \
"

WKS_FILE_DEPENDS ?= " \
    u-boot-rockchip \
    smart-image-userfs \
"

KERNEL_IMAGETYPES:append = " fitImage"
IMAGE_FSTYPES:append = " ext4 squashfs"

HW_VERSION = "1.0"
IMAGE_VERSION = "1.0"
FACTORY_IMAGE = "smart-image-standard"
